# JusticePoint production virtual host. This file is included from Nginx's http context.
fastcgi_cache_path /var/cache/nginx/justicepoint levels=1:2 keys_zone=JUSTICEPOINT:32m inactive=60m max_size=512m use_temp_path=off;

map $http_cookie $jp_logged_in {
    default 0;
    ~*wordpress_logged_in 1;
    ~*wp-postpass 1;
    ~*comment_author 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name justicepoint.crmpl.us;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/justicepoint.crmpl.us/current;
        default_type text/plain;
    }

    location / {
        return 301 https://justicepoint.crmpl.us$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name justicepoint.crmpl.us;

    root /var/www/justicepoint.crmpl.us/current;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 16m;

    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml image/svg+xml;

    ssl_certificate /etc/letsencrypt/live/justicepoint.crmpl.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/justicepoint.crmpl.us/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    access_log /var/www/justicepoint.crmpl.us/shared/logs/access.log;
    error_log /var/www/justicepoint.crmpl.us/shared/logs/error.log warn;

    set $jp_skip_cache 0;
    if ($request_method !~ ^(GET|HEAD)$) {
        set $jp_skip_cache 1;
    }
    if ($query_string != "") {
        set $jp_skip_cache 1;
    }
    if ($request_uri ~* "^/(wp-admin|wp-login\.php|wp-json|wp-cron\.php)") {
        set $jp_skip_cache 1;
    }
    if ($jp_logged_in = 1) {
        set $jp_skip_cache 1;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location = /xmlrpc.php {
        return 403;
    }

    location = /wp-cron.php {
        return 404;
    }

    location ~* ^/wp-content/uploads/.*\.php$ {
        deny all;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_pass unix:/run/php/php8.3-fpm-justicepoint.sock;
        fastcgi_read_timeout 120s;
        fastcgi_hide_header X-Powered-By;

        fastcgi_cache JUSTICEPOINT;
        fastcgi_cache_methods GET HEAD;
        # Keep HEAD and GET separate so a header-only response can never poison a GET cache entry.
        fastcgi_cache_key "$scheme$request_method$host$request_uri";
        fastcgi_cache_bypass $jp_skip_cache;
        fastcgi_no_cache $jp_skip_cache $upstream_http_set_cookie;
        fastcgi_cache_valid 200 10m;
        fastcgi_cache_valid 301 302 1h;
        fastcgi_cache_valid 404 1m;
        fastcgi_cache_use_stale error timeout invalid_header updating http_500 http_503;
        fastcgi_cache_background_update on;
        add_header X-JusticePoint-Cache $upstream_cache_status always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    }

    location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        access_log off;
    }

    location ~* \.(?:xml|txt)$ {
        try_files $uri /index.php?$args;
        expires 10m;
        add_header Cache-Control "public, max-age=600";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    }

    location ~ /\. {
        deny all;
    }
}
