# Temporary HTTP-only virtual host used for origin smoke tests and ACME issuance.
server {
    listen 80;
    listen [::]:80;
    server_name justicepoint.crmpl.us;

    root /var/www/justicepoint.crmpl.us/current;
    index index.php;
    server_tokens off;
    client_max_body_size 16m;

    access_log /var/www/justicepoint.crmpl.us/shared/logs/access.log;
    error_log /var/www/justicepoint.crmpl.us/shared/logs/error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
        default_type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Emulate the final HTTPS origin during the short pre-certificate smoke-test window.
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_pass unix:/run/php/php8.3-fpm-justicepoint.sock;
        fastcgi_hide_header X-Powered-By;
    }

    location ~* ^/wp-content/uploads/.*\.php$ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }
}
